# 모닝(07:00) · 나이트(22:00) 브리핑 자동 실행
#
# 시각표는 GitHub 예약 실행이 맡습니다. AI 분석 글은 config.yaml claude.mode 에 따라
#   routine: Claude 예약 작업(어느 계정이든)이 brief 를 읽고 docs/ai/<날짜>_<슬롯>.json 을 푸시 → (push) 리포트·PDF·영상
#   api    : 수집 단계에서 저장소 비밀값 ANTHROPIC_API_KEY 로 직접 호출 (별도 과금)
# GitHub 예약 실행(cron)은 '최선 노력'이라 수십 분 늦거나 빠질 수 있어 여러 시각에 겹쳐 둡니다 (이미 만든 날은 건너뜀).
#
#  수집 + AI + 리포트  KST 06:00·06:10·06:25 / 21:00·21:10·21:25
#  Claude 루틴이 docs/trigger(수집 신호)·docs/ai(AI 결과)를 푸시하면 push 이벤트로 바로 처리합니다.
#  누락 복구           KST 06:50·07:15·07:45 / 21:50·22:15·22:45
#                      그 시각까지 리포트가 없으면 (데이터가 없으면 수집부터) AI 없이 리포트·영상 생성.
#                      나중에 AI 결과가 오면 push 이벤트로 AI 반영본을 다시 만듭니다.
#  cron 은 UTC 기준입니다. 한국 월요일 아침 = UTC 일요일이라 아침 요일이 0-4 입니다.
name: daily-market-report
on:
  schedule:
    - cron: "0 21 * * 0-4"    # 모닝 수집 + AI (KST 06:00)
    - cron: "10 21 * * 0-4"   # 모닝 백업 수집 (KST 06:10)
    - cron: "25 21 * * 0-4"   # 모닝 백업 수집 (KST 06:25)
    - cron: "50 21 * * 0-4"   # 모닝 누락 복구 (KST 06:50)
    - cron: "15 22 * * 0-4"   # 모닝 누락 복구 (KST 07:15)
    - cron: "45 22 * * 0-4"   # 모닝 누락 복구 (KST 07:45)
    - cron: "0 12 * * 1-5"    # 나이트 수집 + AI (KST 21:00)
    - cron: "10 12 * * 1-5"   # 나이트 백업 수집 (KST 21:10)
    - cron: "25 12 * * 1-5"   # 나이트 백업 수집 (KST 21:25)
    - cron: "50 12 * * 1-5"   # 나이트 누락 복구 (KST 21:50)
    - cron: "15 13 * * 1-5"   # 나이트 누락 복구 (KST 22:15)
    - cron: "45 13 * * 1-5"   # 나이트 누락 복구 (KST 22:45)
  push:
    branches: [main, "claude/**"]   # 루틴이 main 대신 claude/ 브랜치에 올려도 반영
    paths: ["docs/ai/**", "docs/trigger/**"]
  workflow_dispatch:
    inputs:
      step:
        description: "collect = 수집만 / build = 리포트·영상만 / all = 수집 + 리포트·영상"
        type: choice
        options: [all, collect, build]
        default: all
      slot:
        description: "am = 모닝 / pm = 나이트 / auto = 지금 시각 기준(12시 전이면 am)"
        type: choice
        options: [auto, am, pm]
        default: auto
      date:
        description: "날짜 (예: 2026-11-17, 비우면 오늘)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 같은 종류 작업은 한 번에 하나씩 (대기 중인 이전 작업은 최신 작업으로 대체되어도 결과는 같음)
    concurrency:
      group: daily-report-job
      cancel-in-progress: false
    outputs:
      built: ${{ steps.build.outputs.built }}
      date: ${{ steps.plan.outputs.date }}
      slot: ${{ steps.plan.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치 (재시도)
        run: |
          for i in 1 2 3; do pip install --retries 5 -r requirements.txt && break; echo "재시도 $i"; sleep $((i*15)); done

      - name: 할 일·날짜·슬롯 정하기
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_STEP: ${{ github.event.inputs.step }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_DATE: ${{ github.event.inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          d="$(TZ=Asia/Seoul date +%F)"; h=$((10#$(TZ=Asia/Seoul date +%H)))
          slot=""; step=""; force=false
          case "$EVENT" in
            schedule)
              case "$SCHEDULE" in "0 "*|"10 "*|"25 "*) step=collect ;; *) step=recover ;; esac
              # 슬롯은 '지금 시각'이 아니라 '어느 예약이 울렸는지'로 정한다.
              # (GitHub 예약이 몇 시간 밀려 모닝 복구가 낮 12시 넘어 돌면, 시각 기준으로는 나이트로 오인해
              #  장 마감 전 데이터로 나이트 브리핑을 미리 만들어 버리던 문제 — 2026-11-18)
              cron_h="$(echo "$SCHEDULE" | awk '{print $2}')"
              case "$cron_h" in 21|22) slot=am ;; 12|13) slot=pm ;; esac ;;
            push)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then   # 다른 브랜치의 파일을 main 작업본으로 가져옴
                git fetch -q origin "$GITHUB_SHA" && git checkout "$GITHUB_SHA" -- docs/ai/ docs/trigger/ 2>/dev/null || true
              fi
              git fetch -q --depth=50 origin "$GITHUB_SHA" 2>/dev/null || true
              changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || git show --name-only --format= "$GITHUB_SHA")"
              f="$(echo "$changed" | grep -E '^docs/ai/[0-9-]+_(am|pm)\.json$' | tail -n 1)"
              if [ -n "$f" ]; then step=build; else
                f="$(echo "$changed" | grep -E '^docs/trigger/[0-9-]+_(am|pm)\.txt$' | tail -n 1)"; step=collect; fi
              if [ -n "$f" ]; then s="$(basename "$f")"; s="${s%.*}"; d="${s%_*}"; slot="${s##*_}"; fi ;;
            workflow_dispatch)
              step="${IN_STEP:-all}"; slot="${IN_SLOT}"; [ -n "$IN_DATE" ] && d="$IN_DATE"; force=true ;;
          esac
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            if [ "$h" -lt 12 ]; then slot=am; else slot=pm; fi
          fi
          # 나이트는 코스피 마감(15:30) 뒤에만 자동으로 만든다 (직접 실행 workflow_dispatch 는 예외)
          if [ "$slot" = "pm" ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$(TZ=Asia/Seoul date +%F)" = "$d" ] && [ "$h" -lt 16 ]; then
            echo "나이트 슬롯인데 아직 코스피 마감 전(${h}시)이라 건너뜁니다."; step=skip
          fi
          echo "step=$step" >> "$GITHUB_OUTPUT"; echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"; echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "### $d ($slot) · $step (event: $EVENT ${SCHEDULE})" >> "$GITHUB_STEP_SUMMARY"
          echo "할 일: $step / 날짜: $d / 슬롯: $slot"

      - name: 수집 (데이터 묶음 + AI 입력)
        id: collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # [1단계] 제미나이 구글 검색 리서치 (없으면 건너뜀)
          D: ${{ steps.plan.outputs.date }}
          S: ${{ steps.plan.outputs.slot }}
          STEP: ${{ steps.plan.outputs.step }}
          FORCE: ${{ steps.plan.outputs.force }}
        run: |
          git pull -q --rebase --autostash origin main || true
          stem="${D}_${S}"
          need=false
          case "$STEP" in
            collect|all) [ "$FORCE" = "true" ] || [ ! -f "docs/data/$stem.json" ] && need=true ;;
            recover|build) [ ! -f "docs/data/$stem.json" ] && [ ! -f "docs/report_$stem.html" ] && need=true ;;
          esac
          if [ "$need" != "true" ]; then echo "수집 건너뜀 (이미 있음 또는 필요 없음)"; exit 0; fi
          python main.py --slot "$S" --date "$D" --collect --out docs
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data docs/ai cache/ data/gemini_research.json 2>/dev/null || true
          git commit -q -m "데이터 수집: $D ($S)" || echo "변경 없음"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; echo "푸시 재시도 $i"; sleep $((i*10)); done

      - name: 리포트 생성
        id: build
        env:
          D: ${{ steps.plan.outputs.date }}
          S: ${{ steps.plan.outputs.slot }}
          STEP: ${{ steps.plan.outputs.step }}
          FORCE: ${{ steps.plan.outputs.force }}
        run: |
          git pull -q --rebase --autostash origin main || true
          stem="${D}_${S}"
          if [ "$STEP" = "skip" ]; then echo "건너뜀"; echo "built=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 수집 신호로 시작한 실행: API 모드로 AI 결과까지 생긴 경우에만 바로 리포트를 만든다
          if [ "$STEP" = "collect" ] && [ ! -f "docs/ai/$stem.json" ]; then
            echo "수집만 완료 (AI 결과가 올라오면 push 이벤트로 이어서 생성)"; echo "built=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 이미 만든 리포트가 있고, 그 리포트가 AI 반영본이거나 새 AI 결과가 없으면 건너뜀
          if [ "$FORCE" != "true" ] && [ -f "docs/report_$stem.html" ]; then
            has_ai=$(python -c "import json;h=json.load(open('docs/history.json',encoding='utf-8'));print(str(h.get('$D',{}).get('slots',{}).get('$S',{}).get('ai',False)).lower())")
            if [ "$has_ai" = "true" ] || [ ! -f "docs/ai/$stem.json" ]; then
              echo "이미 생성됨 → 건너뜀"; echo "built=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          python main.py --slot "$S" --date "$D" --build --out docs
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/ cache/
          git commit -q -m "브리핑 리포트: $D ($S)" || echo "변경 없음"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; echo "푸시 재시도 $i"; sleep $((i*10)); done
          echo "built=true" >> "$GITHUB_OUTPUT"

  video:
    needs: report
    if: needs.report.outputs.built == 'true'
    uses: ./.github/workflows/daily-report.yml
    with:
      date: ${{ needs.report.outputs.date }}
      slot: ${{ needs.report.outputs.slot }}
    secrets: inherit
