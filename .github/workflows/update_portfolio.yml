# 보유 종목 수동 입력 (스마트폰 GitHub 앱 → Actions → 이 워크플로우 → Run workflow)
#
# 실제 내 증권사 체결가가 추천가와 다르거나, 다른 종목을 샀거나, 이미 팔았을 때 입력합니다.
# 입력 즉시 data/us_swing_portfolio.json · data/trade_history.json 이 내 계좌 상태로 바뀌고,
# 다음 18시 브리핑(또는 '오늘 브리핑 다시 만들기'를 켜면 바로)부터 내 평단가 기준으로 탈출·익절 작전을 짭니다.
#
#   매수추가       새로 산 종목 (ticker, price=내 매수가, qty=수량)   ※ 오늘 예약 종목이면 그 예약을 '체결'로 바꿈
#   수량·단가수정  보유/예약 종목의 평단가·수량 고치기 (예약 종목이면 체결 처리)
#   매도완료       판 종목 (price=내 매도가, qty 비우면 전량)
#   미체결삭제     체결 안 된 예약(또는 잘못 넣은 종목) 지우기
name: 보유 종목 수동 입력
run-name: "수동 입력: ${{ inputs.action }} ${{ inputs.ticker }}"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "작업"
        type: choice
        options: [매수추가, 수량·단가수정, 매도완료, 미체결삭제]
        default: 매수추가
      ticker:
        description: "종목 티커 (예: PLTR)"
        required: true
      price:
        description: "내 실제 매수가/매도가 $ (미체결삭제는 비워도 됨)"
        required: false
        default: ""
      qty:
        description: "수량 (매도완료에서 비우면 전량)"
        required: false
        default: ""
      rebrief:
        description: "오늘 18시 브리핑(리포트·PDF)을 이 내용으로 바로 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTION: ${{ inputs.action }}
      TICKER: ${{ inputs.ticker }}
      PRICE: ${{ inputs.price }}
      QTY: ${{ inputs.qty }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 입력 확인
        run: |
          TICKER=$(echo "$TICKER" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          [[ "$TICKER" =~ ^[A-Z][A-Z0-9.\-]{0,9}$ ]] || { echo "::error::티커 형식 오류: $TICKER"; exit 1; }
          PRICE=$(echo "$PRICE" | tr -d ' $,')
          QTY=$(echo "$QTY" | tr -d ' 주,')
          [ -z "$PRICE" ] || [[ "$PRICE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::가격은 숫자로 (예: 25.40)"; exit 1; }
          [ -z "$QTY" ] || [[ "$QTY" =~ ^[0-9]+$ ]] || { echo "::error::수량은 정수로 (예: 4)"; exit 1; }
          { echo "TICKER=$TICKER"; echo "PRICE=$PRICE"; echo "QTY=$QTY"; } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: for i in 1 2 3; do pip install --retries 5 -r requirements.txt && break; sleep $((i*15)); done

      - name: 보유 목록 반영 → 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--manual "$ACTION" --ticker "$TICKER")
          [ -n "$PRICE" ] && args+=(--price "$PRICE")
          [ -n "$QTY" ] && args+=(--qty "$QTY")
          # 18시 작업과 동시에 올라가 충돌하면, 최신 상태를 받아 다시 반영
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            msg=$(python swing.py "${args[@]}" 2>&1) || { echo "::error::${msg##*$'\n'}"; exit 1; }
            msg="${msg##*$'\n'}"     # 마지막 줄(결과 문장)만
            echo "$msg"
            git add data/us_swing_portfolio.json data/trade_history.json
            git diff --cached --quiet && { echo "변경 없음"; break; }
            git commit -q -m "보유 종목 수동 입력: $ACTION $TICKER"
            git push -q origin HEAD:main && break
            echo "푸시 재시도 $i"; sleep $((i*5))
          done
          {
            echo "### ✅ $msg"
            echo ""
            echo "현재 보유·예약:"
            python -c "import json;[print(f\"- {p['ticker']} {p['status']} {p['qty']}주 @ \${p.get('entry') or p.get('limit')} (목표 \${p['target']} / 손절 \${p['stop']})\") for p in json.load(open('data/us_swing_portfolio.json',encoding='utf-8'))['positions']]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 오늘 브리핑 다시 만들기 (선택)
        if: ${{ inputs.rebrief }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run us-swing.yml --ref main -f date="$(TZ=Asia/Seoul date +%F)" -f force=true -f video=false
