name: 코인 원픽 전진 테스트 기록 (매시간)

# 사용자가 묻지 않아도 매시간 지금 시세로 원픽 엔진을 돌려, 나온 원픽(실험 원픽 포함)을 모두 원픽 일지에 남기고
# 지난 원픽의 결과(익절·손절·미체결·체결 전 무효)를 매긴다 → 과거 백테스트가 아니라 앞으로의 실전 데이터로 규칙을 검증.
# 리포트·알림은 만들지 않는다 (알림은 claude.ai 예약 작업이 따로).
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-journal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 패키지
        run: python -m pip install -q pandas pyyaml requests
      - name: 원픽 엔진 실행 (일지 갱신)
        run: python tools/coin_pick.py > /tmp/pick.json && python -c "import json;d=json.load(open('/tmp/pick.json'));print(d['at_kst'],d['btc']['label'],'원픽',(d.get('pick') or {}).get('symbol'),'실험',(d.get('exp_pick') or {}).get('symbol'))"
      - name: 가상 매매 (3시간마다 진입 · 매시간 채점)
        run: python tools/paper_trade.py settle && python tools/paper_trade.py open /tmp/pick.json || true
      - name: 일지 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pick_journal.json; [ -f data/paper_trades.json ] && git add data/paper_trades.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "원픽 일지(전진 테스트): $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i*10)); done
