name: 리포트 PDF·영상 만들기

# daily-market-report(리포트 생성)가 끝나면 그 워크플로우가 이 파일을 불러서 실행합니다.
#   모닝(am) → PDF·영상(_am) + 유튜브 업로드 / 나이트(pm) → PDF·영상(_pm) + 유튜브 업로드
# Actions 탭에서 날짜·슬롯을 골라 수동 실행도 가능합니다.
on:
  workflow_call:
    inputs:
      date: { type: string, required: true }
      slot: { type: string, required: true }
  workflow_dispatch:
    inputs:
      date:
        description: "리포트 날짜 (예: 2026-11-17)"
        required: true
      slot:
        description: "am = 모닝 / pm = 나이트"
        type: choice
        options: [am, pm]
        default: am

permissions:
  contents: write

concurrency:
  group: daily-report-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DATE: ${{ inputs.date }}
      SLOT: ${{ inputs.slot }}
      TTS_VOICE: ko-KR-SunHiNeural   # 남성 음성: ko-KR-InJoonNeural
      TTS_RATE: "+8%"
      YT_PRIVACY: private
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main      # 방금 커밋된 리포트까지 받기

      - name: 입력 확인
        run: |
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! [[ "$SLOT" =~ ^(am|pm)$ ]]; then
            echo "::error::날짜/슬롯 형식 오류: $DATE $SLOT"; exit 1
          fi
          if [ ! -f "docs/report_${DATE}_${SLOT}.html" ]; then
            echo "::error::docs/report_${DATE}_${SLOT}.html 이 없습니다."; exit 1
          fi
          td=$(python3 -c "import yaml;print(str((yaml.safe_load(open('config.yaml',encoding='utf-8')).get('video') or {}).get('ticker_details',False)).lower())" 2>/dev/null || echo false)
          echo "TICKER_DETAILS=$td" >> "$GITHUB_ENV"
          vm=$(python3 -c "import yaml;print((yaml.safe_load(open('config.yaml',encoding='utf-8')).get('video') or {}).get('mode','short'))" 2>/dev/null || echo short)
          echo "VIDEO_MODE=$vm" >> "$GITHUB_ENV"
          echo "처리: $DATE ($SLOT)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-video.txt

      - name: 한글 글꼴·ffmpeg 설치
        run: |
          for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji ffmpeg && break; sleep $((i*15)); done

      - name: 파이썬 패키지 설치
        run: |
          for i in 1 2 3; do pip install --retries 5 -r requirements-video.txt && break; sleep $((i*15)); done
          for i in 1 2 3; do python -m playwright install --with-deps chromium && break; sleep $((i*15)); done

      - name: PDF·영상 만들기
        run: python tools/build_from_report.py --date "$DATE" --slot "$SLOT" --out "out/$DATE"

      - name: PDF를 docs/pdf 에 저장 (웹 주소로 열람 가능)
        run: |
          mkdir -p docs/pdf
          cp "out/$DATE/report_${DATE}_${SLOT}.pdf" docs/pdf/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "리포트 PDF: $DATE ($SLOT)"
            for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; echo "푸시 재시도 $i"; sleep $((i*10)); done
          fi

      - name: 릴리스에 올리기 (휴대폰 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="report-$DATE"
          files=("out/$DATE/report_${DATE}_${SLOT}.pdf")
          [ -f "out/$DATE/${DATE}_${SLOT}.mp4" ] && files+=("out/$DATE/${DATE}_${SLOT}.mp4")
          desc="out/$DATE/description.txt"
          [ -f "$desc" ] || echo "$DATE 시장 브리핑 ($SLOT)" > "$desc"
          # 설명란은 모닝·나이트 칸을 따로 두고, 이번 슬롯 칸만 새로 바꾼다 (나이트가 올라와도 모닝 설명만 남던 문제)
          old="out/$DATE/release_old.md"; : > "$old"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json body -q .body > "$old" || : > "$old"
          fi
          python3 - "$old" "$desc" "$SLOT" "out/$DATE/release_notes.md" <<'PY'
          import re, sys
          old, desc, slot, out = sys.argv[1:5]
          body = open(old, encoding="utf-8").read().strip()
          blocks = {}
          for s in ("am", "pm"):
              m = re.search(rf"<!-- slot:{s} -->(.*?)<!-- /slot:{s} -->", body, re.S)
              if m:
                  blocks[s] = re.sub(r"^## [^\n]*\n+", "", m.group(1).strip())
          if body and not blocks:          # 칸 표시가 없던 예전 설명은 모닝 칸으로 본다
              blocks["am"] = body
          blocks[slot] = open(desc, encoding="utf-8").read().strip()
          head = {"am": "## 🌅 모닝 브리핑", "pm": "## 🌙 나이트 브리핑"}
          parts = [f"<!-- slot:{s} -->\n{head[s]}\n\n{blocks[s]}\n<!-- /slot:{s} -->" for s in ("pm", "am") if s in blocks]
          open(out, "w", encoding="utf-8").write("\n\n---\n\n".join(parts) + "\n")
          PY
          title="$DATE 시장 브리핑"
          grep -q "<!-- slot:pm -->" "out/$DATE/release_notes.md" && grep -q "<!-- slot:am -->" "out/$DATE/release_notes.md" && title="$DATE 시장 브리핑 (모닝·나이트)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file "out/$DATE/release_notes.md" --latest
          else
            gh release create "$tag" "${files[@]}" --title "$title" --notes-file "out/$DATE/release_notes.md" --latest
          fi
          {
            echo "### $DATE ($SLOT) 결과물"
            echo "- 리포트: https://yorongteni.github.io/stock-daily/report_${DATE}_${SLOT}.html"
            echo "- PDF: https://yorongteni.github.io/stock-daily/pdf/report_${DATE}_${SLOT}.pdf (반영까지 1~2분)"
            echo "- 다운로드: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 유튜브 업로드 (비공개)
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: |
          for i in 1 2 3; do python tools/upload_youtube.py "out/$DATE" && break; echo "업로드 재시도 $i"; sleep $((i*30)); done
