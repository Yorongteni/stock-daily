name: 리포트 PDF·영상 만들기

# daily-market-report(리포트 생성)가 끝나면 자동 실행.
#   오전 실행(10시대, 장 초반) → PDF·영상(_am) + 유튜브 업로드
#   오후 실행(17시대, 장 마감) → PDF·영상(_pm) + 유튜브 업로드
# Actions 탭에서 수동 실행도 가능.
on:
  workflow_run:
    workflows: ["daily-market-report"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "리포트 날짜 (예: 2026-10-20, 비우면 최신)"
        required: false
        default: ""
      slot:
        description: "am = 장 초반판 / pm = 장 마감판 / auto = 지금 시각 기준(12시 전이면 am)"
        required: false
        default: "auto"
        type: choice
        options: [auto, am, pm]

permissions:
  contents: write

concurrency:
  group: daily-report-video
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TTS_VOICE: ko-KR-SunHiNeural   # 남성 음성: ko-KR-InJoonNeural
      TTS_RATE: "+8%"
      YT_PRIVACY: private
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main      # 방금 커밋된 리포트까지 받기

      - name: 날짜와 오전/오후 정하기
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            d="$INPUT_DATE"
          else
            f="$(ls docs/report_????-??-??.html | sort | tail -n 1)"
            d="$(basename "$f" .html)"; d="${d#report_}"
          fi
          if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ ! -f "docs/report_$d.html" ]; then
            echo "::error::docs/report_$d.html 이 없습니다."; exit 1
          fi
          slot="$INPUT_SLOT"
          if [ -z "$slot" ] || [ "$slot" = "auto" ]; then
            h=$((10#$(TZ=Asia/Seoul date +%H)))
            if [ "$h" -lt 12 ]; then slot=am; else slot=pm; fi
          fi
          echo "DATE=$d" >> "$GITHUB_ENV"
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          echo "처리: $d ($slot)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-video.txt

      - name: 한글 글꼴·ffmpeg 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk ffmpeg

      - name: 파이썬 패키지 설치
        run: |
          pip install -r requirements-video.txt
          python -m playwright install --with-deps chromium

      - name: PDF·영상 만들기
        run: python tools/build_from_report.py --date "$DATE" --slot "$SLOT" --out "out/$DATE"

      - name: PDF를 docs/pdf 에 저장 (웹 주소로 열람 가능)
        run: |
          mkdir -p docs/pdf
          cp "out/$DATE/report_${DATE}_${SLOT}.pdf" docs/pdf/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "리포트 PDF: $DATE ($SLOT)"
            git pull --rebase -q
            git push
          fi

      - name: 릴리스에 올리기 (휴대폰 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="report-$DATE"
          files=("out/$DATE/report_${DATE}_${SLOT}.pdf")
          [ -f "out/$DATE/${DATE}_${SLOT}.mp4" ] && files+=("out/$DATE/${DATE}_${SLOT}.mp4")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            notes="out/$DATE/description.txt"
            [ -f "$notes" ] || echo "$DATE 시장 일일 리포트" > "$notes"
            gh release create "$tag" "${files[@]}" --title "$DATE 시장 브리핑" --notes-file "$notes"
          fi
          {
            echo "### $DATE ($SLOT) 결과물"
            echo "- PDF: https://yorongteni.github.io/stock-daily/pdf/report_${DATE}_${SLOT}.pdf (반영까지 1~2분)"
            echo "- 다운로드: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 유튜브 업로드 (비공개)
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: python tools/upload_youtube.py "out/$DATE"
