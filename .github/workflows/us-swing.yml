# 실전 단타 통합 브리핑 (요청할 때만) — 1부 미국 주식 50만 원 단타 + 2부 바이낸스 3배 선물 원픽
#
#  정해진 시간 없이, 실행하는 순간의 시세로 만듭니다.
#    GitHub 앱 → Actions → 실전 단타 통합 브리핑 → Run workflow (또는 Claude 에게 "단타 브리핑 만들어줘")
#  가상 매매 기록은 하지 않습니다 (config.yaml swing/futures.record_picks: false) — 추천 타점은 보여 주기만 합니다.
#  실제로 매매했으면 '보유 포지션 수동 입력'으로 넣으면, 그 포지션의 대응 플랜이 이 브리핑에 매번 들어갑니다.
#    data/us_swing_portfolio.json · data/trade_history.json · data/binance_futures_log.json  (실제 매매만)
#    docs/swing/ (리포트 HTML·데이터 JSON, 같은 날 여러 번 실행하면 그날 최신본) · docs/swing/pdf/ · 릴리스 swing-<날짜>
#  개인 연습용 — 유튜브 업로드·외부 배포를 하지 않습니다. 아침·밤 시황 브리핑과는 별개입니다.
name: 실전 단타 통합 브리핑 (요청 시)
on:
  push:
    branches: [main, "claude/**"]   # docs/trigger-swing/ 에 파일을 푸시해도 바로 시작
    paths: ["docs/trigger-swing/**", "docs/swing/ai/**"]   # ai/ = Claude 가 쓴 1주일 대응 플랜 → 리포트만 다시 그림
  workflow_dispatch:
    inputs:
      video:
        description: "영상도 만들기 (끄면 리포트·PDF만, 약 5분)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BR: ${{ github.event_name == 'push' && 'main' || github.ref_name }}     # 시작 신호로 돌 때도 결과는 main 에

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: swing18-state-${{ github.event_name == 'push' && 'main' || github.ref_name }}
      cancel-in-progress: false
    outputs:
      run: ${{ steps.plan.outputs.run }}
      date: ${{ steps.plan.outputs.date }}
      video: ${{ steps.plan.outputs.video }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: 오늘 할 일 정하기
        id: plan
        env:
          IN_VIDEO: ${{ inputs.video }}
          EVENT: ${{ github.event_name }}
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"     # 실행하는 지금 (같은 날 다시 실행하면 그날 최신본으로 덮어씀)
          if [ "$EVENT" = "push" ]; then        # AI 1주일 플랜만 올라온 경우: 수집 없이 리포트만 다시 그림
            f="$(git show --name-only --format= "$GITHUB_SHA" | grep -E '^docs/swing/ai/[0-9-]+\.json$' | tail -n 1)"
            if [ -n "$f" ]; then
              d="$(basename "$f" .json)"
              echo "date=$d" >> "$GITHUB_OUTPUT"; echo "video=false" >> "$GITHUB_OUTPUT"; echo "run=render" >> "$GITHUB_OUTPUT"
              echo "AI 1주일 플랜 반영: $d"; exit 0
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          vid=false
          [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_VIDEO" = "true" ] && vid=true
          echo "video=$vid" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "요청 시각 $(TZ=Asia/Seoul date '+%F %H:%M') KST · 영상 $vid"

      - name: AI 1주일 플랜 반영 (리포트만 다시 그림)
        if: steps.plan.outputs.run == 'render'
        env:
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -c "import json,swing_report;from pathlib import Path;d=json.load(open('docs/swing/data/$DATE.json',encoding='utf-8'));print(swing_report.write(d,Path('docs')))"
          git add docs/swing
          git diff --cached --quiet || { git commit -q -m "단타 브리핑 AI 1주일 플랜 반영: $DATE"; for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done; }
          echo "### AI 1주일 플랜 반영 $DATE — https://yorongteni.github.io/stock-daily/swing/swing_${DATE}.html" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치 (재시도)
        if: steps.plan.outputs.run == 'true'
        run: for i in 1 2 3; do pip install --retries 5 -r requirements.txt && break; sleep $((i*15)); done

      - name: 판정·대응·타점·리포트 → 커밋·푸시
        if: steps.plan.outputs.run == 'true'
        env:
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/us_swing_portfolio.json data/trade_history.json data/binance_futures_log.json data/pick_journal.json docs/swing"
          build_brief() {   # 데이터 수집이 네트워크 오류로 실패하면 3번까지 다시
            for t in 1 2 3; do python swing.py --date "$DATE" && return 0; echo "수집 재시도 $t"; sleep $((t*20)); done
            return 1
          }
          build_brief
          git add $FILES
          if ! git diff --cached --quiet; then
            git commit -q -m "실전 단타 통합 브리핑: $DATE"
            for i in 1 2 3 4; do
              if git pull -q --rebase --autostash origin "$BR"; then
                git push -q origin "HEAD:$BR" && break
              else
                # 그 사이 수동 입력이 같은 파일을 바꿨으면, 최신 상태에서 다시 계산해 올린다
                git rebase --abort 2>/dev/null || true
                git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
                build_brief && git add $FILES && { git diff --cached --quiet || git commit -q -m "실전 단타 통합 브리핑: $DATE"; }
              fi
              echo "푸시 재시도 $i"; sleep $((i*10))
            done
          fi
          {
            echo "### 실전 단타 통합 브리핑 $DATE"
            echo "- 리포트: https://yorongteni.github.io/stock-daily/swing/swing_${DATE}.html (main 기준)"
            python - <<'PY'
          import json, os
          d = json.load(open(f"docs/swing/data/{os.environ['DATE']}.json", encoding="utf-8"))
          print(f"- 1부 미국: 신규 {len(d['picks'])}종목 · 보유 {len(d['holdings'])}종목" + (f" · {d['block']}" if d.get('block') else ""))
          fu = d.get("futures") or {}
          if fu.get("error"):
              print(f"- 2부 코인: ⚠ {fu['error']}")
          else:
              p = fu.get("pick")
              print(f"- 2부 코인: {fu['bias']['label']} · " + (f"{p['symbol']} {p['side']} 진입 {p['order']['entry']} / TP {p['order']['tp']} / SL {p['order']['sl']}" if p else fu.get("block", "")))
              print(f"- 코인 데이터: {fu.get('source_label')}" + (f" (실패: {'; '.join(fu['source_errors'])})" if fu.get('source_errors') else ""))
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  video:
    needs: state
    if: needs.state.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: swing18-video-${{ github.event_name == 'push' && 'main' || github.ref_name }}
      cancel-in-progress: false
    env:
      DATE: ${{ needs.state.outputs.date }}
      VIDEO: ${{ needs.state.outputs.video }}
      TTS_VOICE: ko-KR-SunHiNeural
      TTS_RATE: "+8%"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}

      - name: 최신 브리핑 받기
        run: git pull -q --rebase --autostash origin "$BR" || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-video.txt

      - name: 한글 글꼴·ffmpeg 설치
        run: for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji ffmpeg && break; sleep $((i*15)); done

      - name: 파이썬 패키지 설치
        run: |
          for i in 1 2 3; do pip install --retries 5 -r requirements-video.txt pyyaml && break; sleep $((i*15)); done
          for i in 1 2 3; do python -m playwright install --with-deps chromium && break; sleep $((i*15)); done

      - name: PDF·영상 만들기 (음성 합성 재시도 포함)
        run: |
          extra=""; [ "$VIDEO" = "true" ] || extra="--pdf-only"
          for i in 1 2 3; do
            python tools/build_swing.py --date "$DATE" --out "out/swing-$DATE" $extra && break
            [ $i = 3 ] && exit 1; echo "PDF·영상 재시도 $i"; sleep $((i*20))
          done

      - name: PDF 저장 (docs/swing/pdf)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/swing/pdf
          cp "out/swing-$DATE/swing_${DATE}.pdf" docs/swing/pdf/
          git add docs/swing/pdf
          if ! git diff --cached --quiet; then
            git commit -q -m "실전 단타 통합 브리핑 PDF: $DATE"
            for i in 1 2 3 4; do git pull -q --rebase --autostash origin "$BR" && git push -q origin "HEAD:$BR" && break; echo "푸시 재시도 $i"; sleep $((i*10)); done
          fi

      - name: 릴리스에 저장 (PDF·MP4·추적 JSON, 휴대폰 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="swing-$DATE"
          files=("out/swing-$DATE/swing_${DATE}.pdf" "docs/swing/data/${DATE}.json")
          [ -f "out/swing-$DATE/swing_${DATE}.mp4" ] && files+=("out/swing-$DATE/swing_${DATE}.mp4")
          notes="out/swing-$DATE/description.txt"; [ -f "$notes" ] || echo "$DATE 실전 단타 통합 브리핑 (개인 연습용)" > "$notes"
          for i in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber && break
            else
              gh release create "$tag" "${files[@]}" --target "$BR" --title "$DATE 실전 단타 통합 브리핑" --notes-file "$notes" && break
            fi
            echo "릴리스 재시도 $i"; sleep $((i*10))
          done
          {
            echo "### $DATE 실전 단타 통합 브리핑 결과물 (외부 업로드 없음)"
            echo "- PDF: docs/swing/pdf/swing_${DATE}.pdf"
            echo "- PDF·영상·JSON 다운로드: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"
