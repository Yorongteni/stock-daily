# 오후 6시 실전 단타 통합 브리핑 (매일 18:00 KST) — 1부 미국 주식 50만 원 단타 + 2부 바이낸스 3배 선물 원픽
#
#  개인 연습용입니다. 유튜브 업로드·외부 배포를 하지 않고 이 저장소에만 저장합니다.
#    data/us_swing_portfolio.json · data/trade_history.json · data/binance_futures_log.json  (추적용 JSON)
#    docs/swing/ (리포트 HTML·데이터 JSON) · docs/swing/pdf/ (PDF) · 릴리스 swing-<날짜> (PDF·MP4)
#  아침·밤 시황 브리핑(daily.yml, daily-report.yml)과는 완전히 별개입니다.
#
#  1) state : 간밤 미국장·추천 이후 코인 1시간봉으로 판정 → 보유 대응 → 오늘 타점 → 리포트 → 커밋·푸시
#  2) video : PDF·16:9 영상(하단 자막 + 큰 글씨 카드) → docs/swing/pdf, 릴리스
#
#  GitHub 예약 실행만으로 돕니다. 늦거나 빠질 수 있어 18:00·18:07·18:20·18:45·19:15·20:40·21:50 에 겹쳐 둡니다 (이미 만들었으면 건너뜀).
#  예약이 몇 시간 밀려 17~23시(KST) 밖에 도착하면 만들지 않습니다 (새벽 시세로 다음 날 브리핑을 미리 만들지 않게).
#  가장 확실한 방법: Claude 예약 작업이 17:57 에 docs/trigger-swing/<날짜>.txt 를 푸시 (ROUTINES.md ①).
#  (docs/trigger-swing/<날짜>.txt 를 푸시해도 바로 시작합니다 — 수동 시작용)
#  코인은 주말에도 거래되므로 매일 실행합니다 (미국 휴장일에는 1부가 '휴장'으로 나옵니다).
#  cron 은 UTC 기준: 09:00 UTC = 18:00 KST.
name: 오후 6시 실전 단타 통합 브리핑
on:
  schedule:
    - cron: "0 9 * * *"       # KST 18:00
    - cron: "7 9 * * *"       # KST 18:07 누락 방지 (정각은 GitHub 예약이 몰려 밀리기 쉬움)
    - cron: "20 9 * * *"      # KST 18:20 누락 방지
    - cron: "45 9 * * *"      # KST 18:45 누락 방지
    - cron: "15 10 * * *"     # KST 19:15 누락 방지
    - cron: "40 11 * * *"     # KST 20:40 누락 방지 (GitHub 예약이 크게 밀리는 날 대비)
    - cron: "50 12 * * *"     # KST 21:50 누락 방지 (17~23시 밖에서 도착한 예약은 건너뜀)
  push:
    branches: [main, "claude/**"]   # 시작 신호 (루틴이 main 대신 claude/ 브랜치에 올려도 반영)
    paths: ["docs/trigger-swing/**"]
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (예: 2026-11-17, 비우면 오늘)"
        required: false
        default: ""
      force:
        description: "이미 만들었어도 다시 만들기 (수동 입력 반영 등)"
        type: boolean
        default: false
      video:
        description: "영상도 만들기 (끄면 리포트·PDF만)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  BR: ${{ github.event_name == 'push' && 'main' || github.ref_name }}     # 시작 신호로 돌 때도 결과는 main 에

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: swing18-state-${{ github.event_name == 'push' && 'main' || github.ref_name }}
      cancel-in-progress: false
    outputs:
      run: ${{ steps.plan.outputs.run }}
      date: ${{ steps.plan.outputs.date }}
      video: ${{ steps.plan.outputs.video }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: 오늘 할 일 정하기
        id: plan
        env:
          IN_DATE: ${{ inputs.date }}
          IN_FORCE: ${{ inputs.force }}
          IN_VIDEO: ${{ inputs.video }}
          EVENT: ${{ github.event_name }}
        run: |
          DATE="${IN_DATE:-$(TZ=Asia/Seoul date +%F)}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::날짜 형식 오류: $DATE"; exit 1; fi
          # GitHub 예약이 몇 시간 밀려 새벽에 돌면, 그날 날짜로 '18시 브리핑'을 새벽 시세로 미리 만들어 버리고
          # 정작 그날 18시에는 '이미 있음'으로 건너뛰던 문제(11/19: 02:47 생성) → 예약 실행은 17~23시(KST)에만 만든다
          H=$((10#$(TZ=Asia/Seoul date +%H)))
          if [ "$EVENT" = "schedule" ] && { [ "$H" -lt 17 ] || [ "$H" -gt 23 ]; }; then
            echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "video=false" >> "$GITHUB_OUTPUT"; echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::예약 실행이 ${H}시(KST)에 늦게 도착 — 18시 브리핑 시간대(17~23시)가 아니라 건너뜁니다."
            exit 0
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          vid=true
          [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_VIDEO" = "false" ] && vid=false
          cfgv=$(python3 -c "import yaml;print(str((yaml.safe_load(open('config.yaml',encoding='utf-8')).get('swing') or {}).get('video',True)).lower())" 2>/dev/null || echo true)
          [ "$cfgv" = "false" ] && vid=false
          echo "video=$vid" >> "$GITHUB_OUTPUT"
          if [ -f "docs/swing/data/$DATE.json" ] && [ "$IN_FORCE" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "이미 $DATE 브리핑이 있어 건너뜁니다."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치 (재시도)
        if: steps.plan.outputs.run == 'true'
        run: for i in 1 2 3; do pip install --retries 5 -r requirements.txt && break; sleep $((i*15)); done

      - name: 판정·대응·타점·리포트 → 커밋·푸시
        if: steps.plan.outputs.run == 'true'
        env:
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/us_swing_portfolio.json data/trade_history.json data/binance_futures_log.json docs/swing"
          build_brief() {   # 데이터 수집이 네트워크 오류로 실패하면 3번까지 다시
            for t in 1 2 3; do python swing.py --date "$DATE" && return 0; echo "수집 재시도 $t"; sleep $((t*20)); done
            return 1
          }
          build_brief
          git add $FILES
          if ! git diff --cached --quiet; then
            git commit -q -m "오후 6시 단타 통합 브리핑: $DATE"
            for i in 1 2 3 4; do
              if git pull -q --rebase --autostash origin "$BR"; then
                git push -q origin "HEAD:$BR" && break
              else
                # 그 사이 수동 입력이 같은 파일을 바꿨으면, 최신 상태에서 다시 계산해 올린다
                git rebase --abort 2>/dev/null || true
                git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
                build_brief && git add $FILES && { git diff --cached --quiet || git commit -q -m "오후 6시 단타 통합 브리핑: $DATE"; }
              fi
              echo "푸시 재시도 $i"; sleep $((i*10))
            done
          fi
          {
            echo "### 오후 6시 단타 통합 브리핑 $DATE"
            echo "- 리포트: https://yorongteni.github.io/stock-daily/swing/swing_${DATE}.html (main 기준)"
            python - <<'PY'
          import json, os
          d = json.load(open(f"docs/swing/data/{os.environ['DATE']}.json", encoding="utf-8"))
          print(f"- 1부 미국: 신규 {len(d['picks'])}종목 · 보유 {len(d['holdings'])}종목" + (f" · {d['block']}" if d.get('block') else ""))
          fu = d.get("futures") or {}
          if fu.get("error"):
              print(f"- 2부 코인: ⚠ {fu['error']}")
          else:
              p = fu.get("pick")
              print(f"- 2부 코인: {fu['bias']['label']} · " + (f"{p['symbol']} {p['side']} 진입 {p['order']['entry']} / TP {p['order']['tp']} / SL {p['order']['sl']}" if p else fu.get("block", "")))
              print(f"- 코인 데이터: {fu.get('source_label')}" + (f" (실패: {'; '.join(fu['source_errors'])})" if fu.get('source_errors') else ""))
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  video:
    needs: state
    if: needs.state.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: swing18-video-${{ github.event_name == 'push' && 'main' || github.ref_name }}
      cancel-in-progress: false
    env:
      DATE: ${{ needs.state.outputs.date }}
      VIDEO: ${{ needs.state.outputs.video }}
      TTS_VOICE: ko-KR-SunHiNeural
      TTS_RATE: "+8%"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}

      - name: 최신 브리핑 받기
        run: git pull -q --rebase --autostash origin "$BR" || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-video.txt

      - name: 한글 글꼴·ffmpeg 설치
        run: for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji ffmpeg && break; sleep $((i*15)); done

      - name: 파이썬 패키지 설치
        run: |
          for i in 1 2 3; do pip install --retries 5 -r requirements-video.txt pyyaml && break; sleep $((i*15)); done
          for i in 1 2 3; do python -m playwright install --with-deps chromium && break; sleep $((i*15)); done

      - name: PDF·영상 만들기 (음성 합성 재시도 포함)
        run: |
          extra=""; [ "$VIDEO" = "true" ] || extra="--pdf-only"
          for i in 1 2 3; do
            python tools/build_swing.py --date "$DATE" --out "out/swing-$DATE" $extra && break
            [ $i = 3 ] && exit 1; echo "PDF·영상 재시도 $i"; sleep $((i*20))
          done

      - name: PDF 저장 (docs/swing/pdf)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/swing/pdf
          cp "out/swing-$DATE/swing_${DATE}.pdf" docs/swing/pdf/
          git add docs/swing/pdf
          if ! git diff --cached --quiet; then
            git commit -q -m "오후 6시 단타 통합 브리핑 PDF: $DATE"
            for i in 1 2 3 4; do git pull -q --rebase --autostash origin "$BR" && git push -q origin "HEAD:$BR" && break; echo "푸시 재시도 $i"; sleep $((i*10)); done
          fi

      - name: 릴리스에 저장 (PDF·MP4·추적 JSON, 휴대폰 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="swing-$DATE"
          files=("out/swing-$DATE/swing_${DATE}.pdf" "docs/swing/data/${DATE}.json")
          [ -f "out/swing-$DATE/swing_${DATE}.mp4" ] && files+=("out/swing-$DATE/swing_${DATE}.mp4")
          notes="out/swing-$DATE/description.txt"; [ -f "$notes" ] || echo "$DATE 오후 6시 단타 통합 브리핑 (개인 연습용)" > "$notes"
          for i in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber && break
            else
              gh release create "$tag" "${files[@]}" --target "$BR" --title "$DATE 오후 6시 단타 통합 브리핑" --notes-file "$notes" && break
            fi
            echo "릴리스 재시도 $i"; sleep $((i*10))
          done
          {
            echo "### $DATE 오후 6시 단타 통합 브리핑 결과물 (외부 업로드 없음)"
            echo "- PDF: docs/swing/pdf/swing_${DATE}.pdf"
            echo "- PDF·영상·JSON 다운로드: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"
