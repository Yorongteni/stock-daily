# 스포트라이트 칼럼용 13개 분야 기본 해설 (AI 분석이 없을 때의 서사형 템플릿 + 선정 로직의 매크로·뉴스 기준)
#
#   past     : 2~3년 전 어떤 기술·사회 변화로 두각을 드러내기 시작했는가 (산업의 어제)
#   now      : 최근 어떤 흐름과 맞물려 주목받는가 (산업의 오늘)
#   drivers  : 핵심 성장 동력 (짧은 명사구)
#   macro    : 지금 매크로 환경에 대한 민감도 (+1 = 이 상태에서 유리, -1 = 불리, 0 = 중립)
#              rate_up: 금리 상승기 / usd_up: 달러 강세·원화 약세 / oil_up: 유가 상승 / risk_off: 공포지수 높음(불안)
#   macro_why: 각 민감도의 이유 (칼럼 문장에 그대로 쓰임)
#   keywords : 뉴스 제목에서 이 분야의 '구조적 흐름'을 찾는 단어 (주가 등락 기사 말고 수출·정책·수주·규제 같은 말)
#   watch    : 균형 잡힌 체크 포인트 (흐름이 꺾일 수 있는 변수)
# 수치는 쓰지 않습니다 (수치는 매일 데이터로 채움). 투자 권유 표현은 쓰지 않습니다.

반도체:
  past: 2023년 생성형 AI 붐 이후 AI 서버에 들어가는 GPU와 고대역폭 메모리(HBM) 수요가 폭발하며 메모리 불황을 벗어나 두각을 드러내기 시작했습니다.
  now: 최근에는 빅테크의 데이터센터 투자가 이어지면서 메모리 가격과 AI 칩 수요가 실적을 끌어올리는 국면이지만, AI 투자 속도에 대한 의심이 생길 때마다 주가가 크게 흔들리고 있습니다.
  drivers: [AI 데이터센터 투자, 고대역폭 메모리(HBM), 메모리 가격 회복]
  macro: {rate_up: -1, usd_up: 1, oil_up: 0, risk_off: -1}
  macro_why:
    rate_up: 금리가 높으면 미래 성장 기대를 크게 반영한 주가 배수가 부담을 받습니다.
    usd_up: 수출 비중이 커서 원화 약세(달러 강세)는 원화로 환산한 이익을 늘려 줍니다.
    risk_off: 시장이 불안할 때는 변동성이 큰 성장 업종부터 팔리는 경향이 있습니다.
  keywords: [HBM, 반도체 수출, 메모리, AI 칩, 데이터센터, 파운드리, 수출 통계, 엔비디아]
  watch: 빅테크 설비투자 계획이 줄거나 메모리 공급이 빠르게 늘면 가격이 꺾일 수 있고, 미국의 수출 규제·관세 변화도 변수입니다.

IT하드웨어·AI인프라:
  past: 2023~2024년 AI 서버 수요가 급증하면서 서버·네트워크 장비·전력 및 냉각 설비처럼 데이터센터를 짓는 데 필요한 하드웨어가 새롭게 주목받기 시작했습니다.
  now: 최근에는 AI 데이터센터 증설이 이어지는 가운데 투자 대비 수익성 논란과 부품 공급 문제가 함께 제기되며 기업별 실적 차이가 커지고 있습니다.
  drivers: [AI 서버 증설, 데이터센터 전력·냉각, 고속 네트워크]
  macro: {rate_up: -1, usd_up: 1, oil_up: 0, risk_off: -1}
  macro_why:
    rate_up: 데이터센터 투자는 대부분 빌린 돈으로 이뤄져 금리가 높을수록 투자 속도 조절 압력이 커집니다.
    usd_up: 국내 부품 기업은 수출 비중이 높아 원화 약세가 이익에 우호적입니다.
    risk_off: AI 투자 기대가 흔들리는 불안 국면에서는 먼저 조정을 받는 편입니다.
  keywords: [AI 서버, 데이터센터, 네트워크, 냉각, MLCC, 기판, 수주]
  watch: 빅테크가 AI 투자 속도를 늦추면 주문이 빠르게 줄 수 있고, 재고 조정과 부품 가격 하락이 이익률을 낮출 수 있습니다.

소프트웨어·보안:
  past: 코로나 이후 구독형 클라우드 소프트웨어가 기업 IT의 표준이 됐고, 2023년 이후에는 생성형 AI를 업무에 붙이는 'AI 에이전트' 경쟁으로 다시 두각을 드러냈습니다.
  now: 최근에는 AI 기반 해킹이 늘며 보안 투자가 필수가 됐고, 데이터 분석·AI 플랫폼 기업으로 기업 고객의 예산이 옮겨 가고 있습니다.
  drivers: [AI 에이전트, 클라우드 구독, 사이버보안 수요]
  macro: {rate_up: -1, usd_up: 0, oil_up: 0, risk_off: 0}
  macro_why:
    rate_up: 이익의 상당 부분이 먼 미래에 있다고 보는 업종이라 금리가 오르면 주가 배수가 낮아지기 쉽습니다.
    risk_off: 구독형 매출이 꾸준해 경기 불안기에도 실적이 비교적 안정적이라는 평가를 받습니다.
  keywords: [AI 에이전트, 보안, 해킹, 클라우드, 구독, 사이버, 랜섬웨어]
  watch: 주가 배수가 높은 기업이 많아 성장 속도가 조금만 둔화돼도 주가가 크게 흔들릴 수 있고, AI가 기존 소프트웨어를 대체할 위험도 있습니다.

인터넷·플랫폼:
  past: 2022년 광고 경기 침체와 비용 문제로 크게 조정받은 뒤, 2023년부터 비용 절감과 AI 기반 광고 효율 개선으로 이익이 다시 늘며 회복하기 시작했습니다.
  now: 최근에는 AI 검색·AI 비서 경쟁과 막대한 AI 인프라 투자가 동시에 진행되며, 광고 수익과 클라우드 성장이 이를 감당할 수 있는지가 관건입니다.
  drivers: [AI 검색·광고, 클라우드, 커머스]
  macro: {rate_up: -1, usd_up: 0, oil_up: 0, risk_off: -1}
  macro_why:
    rate_up: 성장주 성격이 강해 금리 상승기에는 주가 배수가 낮아지는 압력을 받습니다.
    risk_off: 경기가 불안하면 기업들이 광고비부터 줄이는 경향이 있습니다.
  keywords: [광고, AI 검색, 플랫폼 규제, 플랫폼법, 독점, 커머스, 검색 엔진]
  watch: 각국의 플랫폼 규제·반독점 소송과 AI 투자 비용 증가가 이익률을 깎을 수 있습니다.

2차전지·소재:
  past: 2020~2023년 전기차 보급 기대 속에 배터리·소재 기업이 빠르게 성장했지만, 2024년부터 전기차 판매 둔화(캐즘)와 리튬 가격 급락으로 긴 조정을 겪었습니다.
  now: 최근에는 전기차 수요 회복 속도를 기다리는 가운데 에너지저장장치(ESS)·전고체 같은 새 수요처를 찾는 흐름이 이어지고 있습니다.
  drivers: [전기차 보급, 에너지저장장치(ESS), 차세대 배터리]
  macro: {rate_up: -1, usd_up: 1, oil_up: 1, risk_off: -1}
  macro_why:
    rate_up: 공장 증설에 큰돈이 들고 전기차도 할부 구매가 많아 금리가 높으면 수요와 투자 모두 부담을 받습니다.
    usd_up: 해외 공장·수출 비중이 커 원화 약세는 원화 환산 이익에 우호적입니다.
    oil_up: 유가가 오르면 전기차의 연료비 장점이 부각됩니다.
    risk_off: 변동성이 큰 업종이라 불안 국면에서는 매도 압력이 커집니다.
  keywords: [전기차, 배터리, ESS, 리튬, 보조금, IRA, 전고체, 캐즘]
  watch: 미국 보조금 정책 변화, 중국 업체와의 가격 경쟁, 리튬 같은 원료 가격이 실적을 크게 흔들 수 있습니다.

자동차·모빌리티:
  past: 2022~2023년 반도체 부족이 풀리고 SUV·하이브리드 판매가 늘며 국내 완성차 업체가 사상 최대 이익을 내기 시작했습니다.
  now: 최근에는 미국 관세와 환율, 전기차 전환 속도가 이익을 좌우하는 가운데, 주주환원 확대가 주가의 버팀목 역할을 하고 있습니다.
  drivers: [하이브리드·SUV 판매, 주주환원, 전기차·자율주행]
  macro: {rate_up: -1, usd_up: 1, oil_up: -1, risk_off: -1}
  macro_why:
    rate_up: 자동차는 할부 구매가 많아 금리가 높으면 소비자 부담이 커집니다.
    usd_up: 수출 비중이 높아 원화 약세가 원화 환산 이익을 늘려 줍니다.
    oil_up: 유가가 오르면 소비자의 차량 유지비 부담이 커집니다.
    risk_off: 경기 민감 업종이라 경기 불안 신호에 약한 편입니다.
  keywords: [자동차 수출, 관세, 하이브리드, 전기차, 자율주행, 주주환원]
  watch: 미국 관세 정책, 원화 강세 전환, 전기차 가격 경쟁이 이익률을 낮출 수 있습니다.

바이오·헬스케어:
  past: 2023년 비만·당뇨 치료제(GLP-1) 열풍과 국내 기업의 기술수출 성과가 이어지며 신약 개발 기업과 위탁생산(CDMO) 기업이 다시 주목받기 시작했습니다.
  now: 최근에는 금리 수준과 임상·허가 결과에 따라 기업별 주가가 크게 엇갈리고, 미국 약가 인하 정책이 업계 전반의 변수로 떠올랐습니다.
  drivers: [비만 치료제, 기술수출, 바이오 위탁생산, 고령화]
  macro: {rate_up: -1, usd_up: 1, oil_up: 0, risk_off: 1}
  macro_why:
    rate_up: 신약 개발 기업은 먼 미래 이익과 외부 자금 조달에 의존해 금리가 높을수록 불리합니다.
    usd_up: 해외 매출·기술료 비중이 큰 기업은 원화 약세가 우호적입니다.
    risk_off: 대형 제약사는 경기와 무관한 수요가 있어 불안 국면에서 방어적 성격을 보이기도 합니다.
  keywords: [임상, 기술수출, FDA, 허가, 비만, 약가, 바이오시밀러, CDMO]
  watch: 임상 실패나 허가 지연 같은 한 번의 사건에 가치가 크게 움직이고, 미국 약가 정책 변화가 업계 전체에 영향을 줍니다.

금융:
  past: 2022년 이후 금리가 크게 오르며 은행의 예대마진(대출 이자와 예금 이자의 차이)이 늘었고, 2024년 정부의 '기업 밸류업' 정책으로 배당·자사주 소각 같은 주주환원이 강화되며 재평가받기 시작했습니다.
  now: 최근에는 높은 금리가 이어지며 이자 이익이 버티는 가운데, 주주환원 확대가 낮은 주가 배수를 끌어올리는 흐름이 이어지고 있습니다.
  drivers: [높은 금리의 이자 이익, 밸류업·주주환원, 비이자 수익 확대]
  macro: {rate_up: 1, usd_up: 0, oil_up: 0, risk_off: -1}
  macro_why:
    rate_up: 금리가 높으면 대출 이자 수익이 커져 은행 이익에 유리합니다.
    risk_off: 경기 불안이 커지면 대출 부실(연체)에 대비한 비용이 늘 수 있습니다.
  keywords: [밸류업, 주주환원, 배당, 자사주, 금리, 예대마진, 연체율]
  watch: 금리가 빠르게 내려가면 이자 이익이 줄고, 부동산 PF 같은 대출 부실이 커지면 비용이 늘어날 수 있습니다.

조선·방산·기계:
  past: 2022년 러시아·우크라이나 전쟁 이후 각국의 국방비 증액으로 K-방산 수출이 급증했고, 같은 시기 LNG 운반선 발주가 늘며 조선업도 10여 년 만의 호황(슈퍼사이클)에 들어섰습니다.
  now: 최근에는 미국과의 조선 협력(MASGA)·함정 정비 수요와 유럽·중동의 무기 도입이 이어지며 수주 잔고가 쌓인 가운데, 쌓인 수주가 실제 이익으로 바뀌는 단계에 들어서고 있습니다.
  drivers: [방산 수출, LNG선·친환경 선박 발주, 미국 조선 협력]
  macro: {rate_up: 0, usd_up: 1, oil_up: 1, risk_off: 1}
  macro_why:
    usd_up: 선박·무기 대금을 달러로 받는 경우가 많아 원화 약세가 이익에 우호적입니다.
    oil_up: 유가가 오르면 해양 에너지 개발과 운반선 수요가 늘어나는 경향이 있습니다.
    risk_off: 지정학 불안이 커질수록 국방비 증액과 무기 수요가 부각됩니다.
  keywords: [수주, 방산 수출, LNG선, 국방비, 함정, MASGA, 조선 협력, 지정학]
  watch: 수주가 실적으로 잡히기까지 시간이 걸리고, 원자재·인건비 상승이나 전쟁 종료 같은 지정학 변화가 기대를 바꿀 수 있습니다.

전력·에너지:
  past: 2023~2024년 AI 데이터센터의 전력 수요가 폭발하며 변압기·발전 설비 기업이 수년 치 주문을 쌓기 시작했고, 원자력 발전도 탄소 없는 전력원으로 재평가받았습니다.
  now: 최근에는 미국의 노후 전력망 교체와 데이터센터용 전력 계약이 이어지는 가운데, 유가·정책에 따라 정유·전력 회사의 이익이 엇갈리고 있습니다.
  drivers: [데이터센터 전력 수요, 전력망 교체, 원전 재평가]
  macro: {rate_up: -1, usd_up: 1, oil_up: 1, risk_off: 0}
  macro_why:
    rate_up: 발전소·전력망은 큰 빚을 내 짓기 때문에 금리가 높으면 이자 부담이 커집니다.
    usd_up: 변압기 같은 전력기기는 수출 비중이 높아 원화 약세가 우호적입니다.
    oil_up: 유가가 오르면 정유·석유 기업의 이익이 늘어나는 경향이 있습니다.
  keywords: [전력 수요, 변압기, 원전, 데이터센터 전력, 전력망, 유가, 전기요금]
  watch: 데이터센터 투자 둔화나 전력기기 공급 증가로 가격이 꺾일 수 있고, 전기요금·에너지 정책 변화도 변수입니다.

소비재·유통:
  past: 2023년 이후 K-뷰티·K-푸드가 미국·유럽 등으로 수출을 넓히며 국내 화장품·식품 기업에 '내수주'를 넘어선 구조적 성장 흐름이 생기기 시작했습니다.
  now: 최근에는 AI·반도체 같은 성장주가 흔들릴 때 생필품처럼 경기와 상관없이 팔리는 소비재로 자금이 피난하는 흐름과 수출 호조가 맞물려 주목받고 있습니다.
  drivers: [K-뷰티·K-푸드 수출, 경기 방어 수요, 가격 결정력]
  macro: {rate_up: 0, usd_up: 1, oil_up: -1, risk_off: 1}
  macro_why:
    usd_up: 수출 비중이 커진 화장품·식품 기업은 원화 약세가 이익에 우호적입니다.
    oil_up: 유가가 오르면 원재료·물류비가 늘어 이익률을 깎습니다.
    risk_off: 불안 국면에서 경기와 무관한 생필품 수요가 방어적 성격으로 부각됩니다.
  keywords: [K-뷰티, 화장품 수출, K-푸드, 라면, 수출 통계, 소비, 인디 브랜드]
  watch: 소비 경기가 둔화되거나 원재료·물류비가 오르면 이익률이 낮아질 수 있고, 미국 관세·유통 규제도 변수입니다.

통신·미디어·게임:
  past: 오랫동안 성장이 정체된 배당주로 여겨졌지만, 2024년 이후 통신사의 AI 데이터센터(AIDC) 진출과 콘텐츠·게임의 글로벌 흥행으로 새 성장 동력을 찾기 시작했습니다.
  now: 최근에는 통신사의 수익성 개선과 AI 인프라 사업 기대, 게임·엔터 기업의 신작·공연 흥행 여부가 기업별 흐름을 가르고 있습니다.
  drivers: [AI 데이터센터, 배당·주주환원, 콘텐츠 글로벌 흥행]
  macro: {rate_up: -1, usd_up: 0, oil_up: 0, risk_off: 1}
  macro_why:
    rate_up: 배당 매력이 큰 업종이라 금리가 높으면 채권 대비 매력이 줄어듭니다.
    risk_off: 통신은 경기와 무관한 꾸준한 요금 수입이 있어 불안 국면에서 방어적 성격을 보입니다.
  keywords: [AIDC, 데이터센터, 요금, 배당, 신작, 콘텐츠, 공연]
  watch: 통신 요금 규제와 경쟁, 게임·콘텐츠 흥행 실패가 실적을 흔들 수 있습니다.

지주·운송:
  past: 2024년 밸류업 정책과 2025년 상법 개정 논의로 지주회사의 낮은 주가 배수(지주사 할인)를 해소하려는 흐름이 생겼고, 해운은 홍해 사태 이후 운임 급등으로 이익이 크게 늘었습니다.
  now: 최근에는 자사주 소각·배당 확대 같은 지배구조 개선 기대와 운임·물동량 변화가 함께 주가를 움직이고 있습니다.
  drivers: [지배구조 개선·밸류업, 자회사 가치, 해상 운임]
  macro: {rate_up: 0, usd_up: 1, oil_up: -1, risk_off: -1}
  macro_why:
    usd_up: 해운사는 운임을 달러로 받아 원화 약세가 이익에 우호적입니다.
    oil_up: 유가가 오르면 선박 연료비 부담이 커집니다.
    risk_off: 경기 불안은 물동량 감소로 이어질 수 있습니다.
  keywords: [밸류업, 상법 개정, 자사주, 지배구조, 운임, 해운, 물동량]
  watch: 지배구조 개선 기대가 정책 변화로 약해지거나 해상 운임이 떨어지면 이익과 재평가 기대가 줄 수 있습니다.
