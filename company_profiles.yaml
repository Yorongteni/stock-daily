# 스포트라이트 코너용 기업 소개 (universe.yaml 이름 그대로) — "무엇을 만들어 어떻게 돈을 버는가" 한 줄
# AI 분석(docs/ai/*.json 의 spotlight)이 없거나 비어 있을 때 쓰는 기본 설명입니다. 투자 의견은 쓰지 않습니다.

# 반도체
삼성전자: 스마트폰·TV·가전과 메모리 반도체(D램·낸드)를 만들어 파는 한국 최대 전자 기업으로, 이익의 큰 몫이 메모리 반도체에서 나옵니다.
SK하이닉스: D램·낸드 같은 메모리 반도체를 만드는 회사로, AI 서버에 들어가는 고대역폭 메모리(HBM)를 엔비디아 등에 공급해 돈을 법니다.
한미반도체: 반도체 칩을 쌓고 붙이는 후공정 장비(TC 본더 등)를 만들어 메모리 회사에 파는 장비 기업입니다.
이오테크닉스: 레이저로 반도체 웨이퍼에 글자를 새기거나 자르는 레이저 장비를 만들어 반도체 회사에 파는 기업입니다.
리노공업: 반도체 칩이 제대로 작동하는지 검사할 때 쓰는 테스트 핀·소켓을 만들어 파는 소모품 기업입니다.
엔비디아: AI 학습·추론에 쓰이는 GPU(그래픽 처리 장치)와 데이터센터용 시스템을 설계해 클라우드·빅테크 기업에 팔아 돈을 법니다.
브로드컴: 네트워크·통신용 반도체와 빅테크 맞춤형 AI 칩을 설계하고, 기업용 소프트웨어(VM웨어 등)도 파는 회사입니다.
AMD: PC·서버용 CPU와 AI용 GPU를 설계해 파는 반도체 회사로, 공장 없이 설계만 하고 생산은 TSMC에 맡깁니다.
인텔: PC·서버용 CPU를 설계하고 직접 생산하는 반도체 회사로, 다른 회사 칩을 대신 만들어 주는 파운드리 사업도 키우고 있습니다.
퀄컴: 스마트폰의 두뇌인 AP(스냅드래곤)와 통신 모뎀 칩을 팔고, 이동통신 특허 사용료(로열티)로도 돈을 법니다.
텍사스인스트루먼트: 전기 신호를 다루는 아날로그 칩과 소형 제어 칩을 만들어 자동차·산업 장비 회사에 파는 기업입니다.
마이크론: D램·낸드 같은 메모리 반도체를 만들어 PC·스마트폰·AI 서버 회사에 파는 미국 최대 메모리 기업입니다.
어플라이드머티어리얼즈: 반도체 웨이퍼에 막을 입히고 깎는 공정 장비를 만들어 전 세계 반도체 공장에 파는 장비 1위권 기업입니다.
램리서치: 반도체 회로를 깎아내는 식각 장비와 막을 입히는 증착 장비를 만들어 메모리·파운드리 회사에 파는 기업입니다.
KLA: 반도체를 만드는 중간중간 불량이 없는지 검사·측정하는 장비를 파는 기업입니다.
아날로그디바이스: 센서·전력 관리용 아날로그 반도체를 만들어 산업 장비·자동차·통신 회사에 파는 기업입니다.
마벨: 데이터센터·네트워크용 반도체와 빅테크 맞춤형 칩을 설계해 파는 회사입니다.
ARM: 스마트폰 칩 대부분이 쓰는 CPU 설계도를 만들어, 칩 회사에 설계 사용료와 로열티를 받고 빌려주는 회사입니다.
TSMC(ADR): 애플·엔비디아 같은 회사가 설계한 칩을 대신 생산해 주는 세계 1위 파운드리(반도체 위탁생산) 기업입니다.
ASML(ADR): 최첨단 반도체 회로를 그리는 노광 장비(EUV)를 사실상 혼자 만드는 네덜란드 장비 기업입니다.

# IT하드웨어·AI인프라
삼성전기: 전자제품 속 작은 부품인 MLCC(적층세라믹콘덴서), 카메라 모듈, 반도체 기판을 만들어 파는 부품 기업입니다.
LG이노텍: 아이폰 등에 들어가는 카메라 모듈과 반도체 기판을 만들어 파는 부품 기업입니다.
LG전자: 냉장고·세탁기·TV 같은 가전과 자동차 전장 부품, 냉난방 공조 장비를 만들어 파는 기업입니다.
애플: 아이폰·맥·아이패드 같은 기기를 팔고, 앱스토어·아이클라우드 같은 서비스 이용료로도 돈을 버는 회사입니다.
델: 기업용 서버·저장장치와 PC를 만들어 파는 회사로, 최근 AI 서버 판매가 크게 늘었습니다.
슈퍼마이크로: 엔비디아 GPU를 넣은 AI 서버를 고객 맞춤형으로 빠르게 조립해 데이터센터에 파는 회사입니다.
아리스타네트웍스: 데이터센터 서버들을 빠르게 연결하는 고성능 네트워크 스위치를 만들어 클라우드 기업에 파는 회사입니다.
시스코: 기업·통신사용 네트워크 장비(라우터·스위치)와 보안·협업 소프트웨어를 파는 회사입니다.
버티브: 데이터센터의 전력 공급 장치와 냉각 설비를 만들어 파는 회사로, AI 데이터센터 증가의 수혜 업종입니다.

# 소프트웨어·보안
삼성에스디에스: 삼성 계열사 등 기업에 IT 시스템 구축·클라우드 서비스를 제공하고, 물류 대행 사업도 하는 IT 서비스 기업입니다.
마이크로소프트: 윈도·오피스 같은 소프트웨어 구독료와 클라우드(애저) 이용료로 돈을 버는 세계 최대 소프트웨어 기업입니다.
오라클: 기업용 데이터베이스 소프트웨어와 클라우드 인프라를 빌려주고 이용료를 받는 회사입니다.
세일즈포스: 기업이 고객 정보를 관리하는 CRM 소프트웨어를 인터넷으로 빌려주고 월 구독료를 받는 회사입니다.
어도비: 포토샵·PDF 같은 디자인·문서 소프트웨어를 구독형으로 파는 회사입니다.
서비스나우: 기업 내부 업무(IT 요청·인사 등)를 자동으로 처리하는 소프트웨어를 구독형으로 파는 회사입니다.
인튜이트: 미국 세금 신고 프로그램(터보택스)과 소상공인 회계 소프트웨어를 파는 회사입니다.
IBM: 기업용 IT 컨설팅, 하이브리드 클라우드 소프트웨어, 대형 컴퓨터를 파는 오래된 IT 기업입니다.
액센츄어: 전 세계 기업의 디지털 전환·IT 시스템 구축을 도와주고 컨설팅 비용을 받는 회사입니다.
팔란티어: 정부·기업의 방대한 데이터를 모아 분석하고 AI로 의사결정을 돕는 소프트웨어를 파는 회사입니다.
팔로알토네트웍스: 기업 네트워크를 해킹에서 지키는 방화벽과 보안 소프트웨어를 파는 사이버보안 기업입니다.
크라우드스트라이크: 회사 컴퓨터·서버를 해킹에서 지키는 보안 소프트웨어를 클라우드 구독형으로 파는 기업입니다.
스노우플레이크: 기업 데이터를 클라우드에 모아 저장·분석하게 해 주고 사용한 만큼 요금을 받는 회사입니다.

# 인터넷·플랫폼
NAVER: 국내 1위 검색 포털로 검색 광고, 쇼핑 수수료, 웹툰·클라우드 사업으로 돈을 버는 회사입니다.
카카오: 카카오톡을 기반으로 광고, 선물하기 같은 커머스, 게임·콘텐츠·금융 서비스로 돈을 버는 회사입니다.
알파벳: 구글 검색·유튜브 광고와 구글 클라우드로 돈을 버는 구글의 모회사입니다.
메타: 페이스북·인스타그램·왓츠앱 이용자에게 보여 주는 광고로 돈을 버는 회사입니다.
아마존: 온라인 쇼핑몰과 세계 1위 클라우드 서비스(AWS), 광고로 돈을 버는 회사입니다.
우버: 차량 호출과 음식 배달을 연결해 주고 건당 수수료를 받는 플랫폼 기업입니다.
에어비앤비: 여행객과 숙소 주인을 연결해 주고 예약 수수료를 받는 숙박 공유 플랫폼입니다.
쇼피파이: 소상공인이 온라인 쇼핑몰을 쉽게 만들도록 도구를 빌려주고 구독료·결제 수수료를 받는 회사입니다.

# 2차전지·소재
LG에너지솔루션: 전기차·에너지저장장치(ESS)에 들어가는 배터리를 만들어 자동차 회사에 파는 국내 1위 배터리 기업입니다.
삼성SDI: 전기차·전자기기용 배터리와 ESS 배터리를 만들어 파는 기업입니다.
LG화학: 석유화학 제품과 배터리 소재(양극재), 생명과학 사업을 하는 화학 기업으로 LG에너지솔루션의 모회사입니다.
포스코퓨처엠: 배터리의 핵심 소재인 양극재·음극재를 만들어 배터리 회사에 파는 포스코그룹 소재 기업입니다.
에코프로비엠: 배터리 양극재(배터리 용량을 좌우하는 핵심 소재)를 만들어 배터리 회사에 파는 기업입니다.
에코프로: 양극재 회사 에코프로비엠 등을 거느린 지주회사로, 배터리 소재 원료 사업도 합니다.
POSCO홀딩스: 철강 회사 포스코와 리튬 등 배터리 원료 사업을 거느린 지주회사입니다.
고려아연: 아연·연·은 같은 비철금속을 제련해 파는 세계 1위권 제련 기업입니다.
현대제철: 자동차 강판·철근 같은 철강 제품을 만들어 파는 국내 2위 철강 기업입니다.
린데: 산소·질소·수소 같은 산업용 가스를 생산해 반도체·의료·제조 공장에 장기 계약으로 공급하는 기업입니다.

# 자동차·모빌리티
현대차: 승용차·SUV·전기차를 만들어 전 세계에 팔고, 할부 금융으로도 돈을 버는 국내 1위 자동차 회사입니다.
기아: 현대차그룹의 완성차 회사로 SUV·전기차 중심으로 국내외에 자동차를 팝니다.
현대모비스: 현대차·기아에 핵심 부품 모듈과 애프터서비스(A/S) 부품을 공급하는 부품 기업입니다.
테슬라: 전기차를 만들어 팔고, 에너지 저장장치·자율주행 소프트웨어 사업도 하는 회사입니다.

# 바이오·헬스케어
삼성바이오로직스: 다른 제약사가 개발한 바이오 의약품을 대신 대량 생산해 주는 위탁생산(CDMO) 세계 1위권 기업입니다.
셀트리온: 비싼 바이오 의약품의 복제약(바이오시밀러)을 개발·생산해 전 세계에 파는 기업입니다.
유한양행: 전문의약품·일반의약품을 파는 제약사로, 폐암 신약 기술수출 로열티도 받습니다.
한미약품: 비만·당뇨 치료제 등 신약을 개발하고, 국내외에 의약품을 파는 제약사입니다.
알테오젠: 주사형 약을 피하주사(피부 아래 주사)로 바꾸는 플랫폼 기술을 글로벌 제약사에 빌려주고 기술료를 받는 기업입니다.
HLB: 간암 신약 등 항암제를 개발하는 바이오 기업으로, 신약 허가 여부가 회사 가치를 크게 좌우합니다.
리가켐바이오: 항체에 약물을 붙여 암세포만 공격하는 ADC 기술을 개발해 글로벌 제약사에 기술수출하는 기업입니다.
펩트론: 약효가 오래 가는 주사제를 만드는 기술(장기 지속형 제형)을 개발해 제약사와 협력하는 바이오 기업입니다.
파마리서치: 연어 DNA 성분 피부 재생 주사(리쥬란)와 의약품·화장품을 파는 회사입니다.
휴젤: 주름 개선용 보툴리눔 톡신(보톡스 같은 주사제)과 필러를 만들어 국내외에 파는 기업입니다.
클래시스: 피부 미용 시술에 쓰는 고주파·초음파 장비와 소모품을 만들어 병원에 파는 기업입니다.
일라이릴리: 비만·당뇨 치료제(마운자로·젭바운드) 등 신약을 개발해 파는 미국 대형 제약사입니다.
유나이티드헬스: 미국 최대 건강보험사로 보험료와 의료 서비스·약국 관리 사업으로 돈을 법니다.
존슨앤드존슨: 전문의약품과 수술 기구 같은 의료기기를 파는 대형 헬스케어 기업입니다.
애브비: 면역질환 치료제(스카이리치·린보크) 등 전문의약품을 파는 미국 제약사입니다.
머크: 면역항암제 키트루다와 백신 등 전문의약품을 파는 미국 제약사입니다.
화이자: 신약·백신을 개발해 파는 미국 대형 제약사입니다.
써모피셔: 제약·연구소가 쓰는 실험 장비와 시약, 위탁 연구 서비스를 파는 기업입니다.
애보트: 진단기기, 혈당 측정기, 영양제품, 의료기기를 파는 헬스케어 기업입니다.
다나허: 바이오 의약품 생산 장비와 진단·실험 장비를 파는 기업입니다.
