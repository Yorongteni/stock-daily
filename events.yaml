# 공식 발표로 확인한 일정만 적습니다 (events.py 가 앞으로 7일, 대형은 14일 안의 것을 brief·리포트에 넣음). 새 일정은 아래 형식으로 추가하면 됩니다.
# 날짜는 한국 시간(KST) 기준. 확인되지 않은 일정은 적지 않습니다 — 그런 일은 AI 가 기사로 확인해 upcoming_events 에 씁니다.
# 항목: date, time_kst, title, scale(대형/중형/소형), markets(영향 시장·분야), note, status(생략하면 '확정(공식 일정)'),
#       scenarios: 결과별 영향 [{if: "이렇게 나오면", then: "→ 어떤 시장·분야가 어떻게"}]
#       — AI 분석이 없는 날에도 리포트·영상에 나오는 기본 분석. AI 가 있는 날은 AI 가 그날 상황에 맞게 다시 씁니다.

# 미국 연준 FOMC 2026년 일정 (연준 공식 일정, 결과는 둘째 날 미국 14:00 = 한국 다음 날 04:00)
- date: "2026-12-10"
  time_kst: "04:00 (미국 12/9 14:00 ET)"
  title: "미국 FOMC 금리 결정 (12월 8~9일 회의)"
  scale: 대형
  markets: "전 자산 — 미국 금리·달러·성장주·반도체, 코스피 외국인 수급, 금·비트코인"
  note: "12월 인상 폭(0.25%p 또는 0.5%p)과 내년 금리 전망(점도표)이 최대 관심사"
  scenarios:
    - { if: "0.25%p 인상 + 추가 인상 신호 약함", then: "예상대로라 불확실성 해소 → 미국 금리·달러 안정, 성장주·반도체 안도 반등, 코스피 외국인 매도 완화" }
    - { if: "0.5%p 인상 또는 내년 추가 인상 강하게 시사", then: "미국 금리·달러 급등 → 나스닥·반도체·2차전지 등 성장주 급락, 원/달러 상승·외국인 매도, 금·비트코인 약세. 은행주는 상대적으로 버팀" }
    - { if: "동결", then: "시장 예상 밖 완화 신호 → 성장주·반도체 강한 반등, 달러 약세. 다만 물가를 못 잡는다는 우려가 커지면 금리가 다시 오를 수 있음" }

